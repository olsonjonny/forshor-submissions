name: Publish Verified Results
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed verification run to recover after maintenance
        required: true
        type: string
      source_run_attempt:
        description: Exact original verification attempt
        required: true
        default: '1'
        type: string
  workflow_run:
    # Retain the old name so historical verification runs can still be retried.
    workflows: [Policy submission, Table submission, Verify Table Generation]
    types: [completed]
permissions: {}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # One publisher at a time; do not drop intermediate accepted submissions.
    concurrency:
      group: forshor-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      pull-requests: write
      checks: write
      id-token: write
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.source_run_attempt }}
      PUBLISHER_URL: ${{ vars.PUBLISHER_URL }}
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test archive and recovery trust boundaries
        run: |
          node scripts/test_report_trust.js
          node --test scripts/test_publication.js
          node --test scripts/test_pr_publication.js scripts/test_policy_publication.js
          node --test scripts/test_notify_submitters.js
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Inspect the exact source attempt
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./scripts/ci/publication.js').inspect({ github, context, core });
      - name: Download verifier output as data
        if: steps.source.outputs.process == 'true' && steps.source.outputs.download == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Prepare verified publication identity
        id: publication
        if: steps.source.outputs.process == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./scripts/ci/publication.js').archive({ github, context, core });
      - name: Obtain short-lived publisher identity
        if: steps.source.outputs.process == 'true'
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1015282270412/locations/global/workloadIdentityPools/forshor-staging/providers/github-submissions
          service_account: forshor-results-ci@forshor-services.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ vars.PUBLISHER_URL }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Check whether this evaluation is already published
        if: steps.source.outputs.process == 'true'
        id: completed
        env:
          PUBLISHER_TOKEN: ${{ steps.google.outputs.id_token }}
        run: |
          if [ "${{ steps.publication.outputs.kind }}" = policy ]; then
            python3 scripts/ci/publish_policy.py --check
          else
            python3 evaluation/publish.py --check
          fi
      - name: Checkout accepted archive only
        if: steps.source.outputs.process == 'true' && steps.completed.outputs.complete != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: submission-results
          path: archive
          persist-credentials: false
      - name: Restore the pinned estimator environment
        if: steps.source.outputs.process == 'true' && steps.completed.outputs.complete != 'true' && steps.publication.outputs.kind != 'policy'
        uses: ./.github/actions/estimator-environment
      - name: Check every original resource estimate against the pinned baseline
        if: steps.source.outputs.process == 'true' && steps.completed.outputs.complete != 'true' && steps.publication.outputs.kind != 'policy'
        run: python -m unittest discover -s evaluation -p 'test_*.py'
      - name: Estimate and publish with conflict and transport recovery
        if: steps.source.outputs.process == 'true' && steps.completed.outputs.complete != 'true' && steps.publication.outputs.kind != 'policy'
        env:
          PUBLISHER_TOKEN: ${{ steps.google.outputs.id_token }}
          GH_TOKEN: ${{ github.token }}
        run: python evaluation/publish.py
      - name: Restore the v2 policy resource engine
        if: steps.source.outputs.process == 'true' && steps.completed.outputs.complete != 'true' && steps.publication.outputs.kind == 'policy'
        uses: ./.github/actions/policy-engine-environment
      - name: Revalidate, archive and publish the verified policy
        if: steps.source.outputs.process == 'true' && steps.completed.outputs.complete != 'true' && steps.publication.outputs.kind == 'policy'
        env:
          PUBLISHER_TOKEN: ${{ steps.google.outputs.id_token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish_policy.py
      - name: Report publication on the PR and close accepted submissions
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUBLICATION_OUTCOME: ${{ job.status }}
        with:
          script: |
            await require('./scripts/ci/pr_publication.js').finalize({
              github, context, core, outcome: process.env.PUBLICATION_OUTCOME,
            });
      - name: Explain recovery after a failure
        if: failure()
        run: |
          if grep -q '"stage": "duplicate"' publication-result.json 2>/dev/null; then
            echo '::notice::Not published: this policy repeats one that is already published. Nothing needs rerunning; the author was told on the pull request.'
            echo '## Not published: repeated policy' >> "$GITHUB_STEP_SUMMARY"
            echo 'This exact policy is already published (see the duplicate-policy refusal in publication-result.json). A rerun gives the same answer.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '::error::Publication failed. The last complete snapshot remains visible. Rerun this Publish Verified Results workflow to reuse verification; do not rerun Lean.'
          echo '## Recovery' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rerun this publication workflow (or its failed job). The source run and attempt stay fixed, accepted verification is reused, and an already completed publication becomes a no-op.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication diagnostics without credentials
        if: always() && steps.source.outputs.report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-source.json
            evaluation-metadata.json
            publication-result.json
            publication-check.json
          retention-days: 14
